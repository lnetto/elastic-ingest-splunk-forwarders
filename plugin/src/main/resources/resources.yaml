# The templates and ingest pipeline S2STemplateRegistry installs. Raise "version" whenever one of them changes: the elected master then
# puts them again (it never overwrites a newer version).
version: 6
component-templates:
  - logs-splunk.s2s@mappings
  - logs-splunk.s2s@settings
index-templates:
  - logs-splunk.s2s@template
ingest-pipelines:
  - logs-splunk.s2s@default-pipeline: {}
