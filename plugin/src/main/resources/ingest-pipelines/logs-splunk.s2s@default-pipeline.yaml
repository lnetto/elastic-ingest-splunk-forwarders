version: ${splunk_forwarders.template.version}
_meta:
  description: Default pipeline of the ingest-splunk-forwarders plugin's data streams (logs-splunk.s2s-*), installed by the plugin
  managed: true
description: >-
  Default pipeline of logs-splunk.s2s-* (index.default_pipeline in logs-splunk.s2s@settings). Managed by the ingest-splunk-forwarders plugin,
  which replaces it on upgrade: put your processors in the logs-splunk.s2s@custom pipeline, which this one calls.
processors:
  - set:
      description: If '@timestamp' is missing, set it with the ingest timestamp (as logs@default-pipeline does)
      field: "@timestamp"
      copy_from: _ingest.timestamp
      override: false
  - set:
      description: When Elasticsearch received the event (ECS event.ingested), as Fleet's final pipeline sets it, unless the plugin set it already
      field: event.ingested
      copy_from: _ingest.timestamp
      override: false
  - pipeline:
      description: Fleet's hook for every integration's data; doesn't exist unless you create it
      name: global@custom
      ignore_missing_pipeline: true
  - pipeline:
      description: Your processors for every logs-*-* data stream (what Elasticsearch's logs@default-pipeline calls); doesn't exist unless you create it
      name: logs@custom
      ignore_missing_pipeline: true
  - pipeline:
      description: Your processors for these streams; the plugin never creates or changes this pipeline
      name: logs-splunk.s2s@custom
      ignore_missing_pipeline: true
