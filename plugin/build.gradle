plugins {
    id 'java'
}

group = 'co.elastic.s2shttp'
version = "${pluginVersion}"

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by the Elasticsearch runtime; never bundled.
    compileOnly "org.elasticsearch:elasticsearch:${esVersion}"
    // Security extension SPI (roles provider); provided by x-pack-security at runtime.
    compileOnly("org.elasticsearch.plugin:x-pack-core:${esVersion}") { transitive = false }
    testImplementation "org.elasticsearch:elasticsearch:${esVersion}"
    testImplementation("org.elasticsearch.plugin:x-pack-core:${esVersion}") { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs << '-Xlint:all,-processing,-serial,-try' << '-Werror'
}

test {
    useJUnitPlatform()
    systemProperty 'update.golden', System.getProperty('update.golden', 'false')
    systemProperty 's2s.samples', System.getProperty('s2s.samples', 'src/test/resources/samples')
    outputs.upToDateWhen { false }
    testLogging { events 'failed'; exceptionFormat 'full'; showStandardStreams = true }
}

def descriptor = tasks.register('pluginDescriptor', Copy) {
    from 'src/main/plugin-metadata'
    into layout.buildDirectory.dir('plugin-metadata')
    // declared so a version bump re-expands the descriptor instead of reusing a cached one
    inputs.property('pluginVersion', project.version)
    inputs.property('esVersion', esVersion)
    expand(pluginVersion: project.version, esVersion: esVersion)
}

tasks.register('bundlePlugin', Zip) {
    dependsOn jar, descriptor
    archiveFileName = "ingest-splunk-forwarders-${project.version}-es${esVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from jar
    from descriptor
    from('..') {
        include 'LICENSE', 'NOTICE'
        rename { "${it}.txt" }
    }
}
