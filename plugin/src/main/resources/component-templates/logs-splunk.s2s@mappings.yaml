version: ${splunk_forwarders.template.version}
_meta:
  description: Fields the ingest-splunk-forwarders plugin writes on every event
  managed: true
template:
  mappings:
    properties:
      event:
        properties:
          module: { type: keyword }
      network:
        properties:
          forwarded_ip: { type: ip, ignore_malformed: true }
      splunk:
        properties:
          time: { type: date }
          host: { type: keyword, ignore_above: 1024 }
          source: { type: keyword, ignore_above: 1024 }
          sourcetype: { type: keyword, ignore_above: 1024 }
          index: { type: keyword, ignore_above: 1024 }
          channel: { type: keyword, ignore_above: 1024 }
          token_name: { type: keyword }
          token_sha256: { type: keyword }
          # one field whatever indexed fields arrive (a heavy forwarder's own logs carry hundreds)
          fields: { type: flattened, ignore_above: 1024 }
          meta: { type: flattened }
          s2s:
            properties:
              flags: { type: long }
              stream_id: { type: keyword }
              offset: { type: long }
              seq: { type: long }
              time: { type: long }
              date_parts: { type: object, enabled: false }
              csv_header: { type: keyword }
              timezone: { type: keyword, ignore_above: 1024 }
              structured: { type: boolean }
              record_line: { type: long }
              record_lines: { type: long }
          request:
            properties:
              id: { type: keyword }
              received: { type: date }
              node: { type: keyword }
              remote_address: { type: ip, ignore_malformed: true }
              x_forwarded_for: { type: keyword, ignore_above: 1024 }
              headers: { type: flattened }
              bytes: { type: long }
              inflated_bytes: { type: long }
              records: { type: long }
              done_markers: { type: long }
              body_base64: { type: binary }
